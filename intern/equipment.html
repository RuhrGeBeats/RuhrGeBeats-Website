<script>

const SUPABASE_URL =
  "https://spqsuedpmrxcbefpocho.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_m-jonK9Ca3K10OKxaorcgQ_9P5OhVGr";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const STORAGE_BUCKET =
  "equipment-images";

const equipmentContainer =
  document.getElementById(
    "equipmentContainer"
  );

const equipmentModal =
  document.getElementById(
    "equipmentModal"
  );

const equipmentForm =
  document.getElementById(
    "equipmentForm"
  );

const modalTitle =
  document.getElementById(
    "modalTitle"
  );

const equipmentId =
  document.getElementById(
    "equipmentId"
  );

const equipmentName =
  document.getElementById(
    "equipmentName"
  );

const equipmentCategory =
  document.getElementById(
    "equipmentCategory"
  );

const equipmentDescription =
  document.getElementById(
    "equipmentDescription"
  );

const equipmentSortOrder =
  document.getElementById(
    "equipmentSortOrder"
  );

const equipmentActive =
  document.getElementById(
    "equipmentActive"
  );

const equipmentImages =
  document.getElementById(
    "equipmentImages"
  );

const imageList =
  document.getElementById(
    "imageList"
  );

const messageBox =
  document.getElementById(
    "message"
  );

const saveBtn =
  document.getElementById(
    "saveBtn"
  );

let equipmentData = [];

let currentImages = [];

let pendingImageFiles = [];


/* ================================
   MESSAGE
   ================================ */

function showMessage(
  text,
  type = "success"
) {

  messageBox.textContent = text;

  messageBox.className =
    "message show " + type;

  setTimeout(() => {

    messageBox.className =
      "message";

  }, 4500);
}


/* ================================
   AUTH
   ================================ */

async function checkAuth() {

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if (error) {

    console.error(error);

    window.location.replace(
      "/intern/index.html"
    );

    return false;
  }

  if (!data.session) {

    window.location.replace(
      "/intern/index.html"
    );

    return false;
  }

  return true;
}


/* ================================
   IMAGE URL
   ================================ */

function getImageUrl(
  storagePath
) {

  const {
    data
  } = supabaseClient
    .storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(
      storagePath
    );

  return data.publicUrl;
}


/* ================================
   LOAD
   ================================ */

async function loadEquipment() {

  equipmentContainer.innerHTML =
    '<div class="loading">Equipment wird geladen …</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("equipment")
    .select(`
      *,
      equipment_images (
        id,
        storage_path,
        sort_order,
        created_at
      )
    `)
    .order("sort_order", {
      ascending: true
    })
    .order("created_at", {
      ascending: true
    });

  if (error) {

    console.error(error);

    equipmentContainer.innerHTML = `
      <div class="empty-state">
        <strong>Equipment konnte nicht geladen werden.</strong>
        <p>${escapeHtml(error.message)}</p>
      </div>
    `;

    return;
  }

  equipmentData =
    data || [];

  renderEquipment();
}


/* ================================
   RENDER
   ================================ */

function renderEquipment() {

  if (!equipmentData.length) {

    equipmentContainer.innerHTML = `
      <div class="empty-state">
        <h3>Noch kein Equipment vorhanden</h3>

        <p>
          Lege dein erstes Equipment an,
          damit Kunden es später bei einer
          Anfrage auswählen können.
        </p>
      </div>
    `;

    return;
  }

  equipmentContainer.innerHTML = `
    <div class="equipment-grid">
      ${
        equipmentData
          .map(
            renderEquipmentCard
          )
          .join("")
      }
    </div>
  `;

  equipmentData.forEach(
    equipment => {

      const images =
        (
          equipment.equipment_images ||
          []
        )
        .slice()
        .sort(
          (a, b) =>
            (a.sort_order || 0) -
            (b.sort_order || 0)
        );

      if (images.length > 1) {

        window[
          "equipmentImages_" +
          equipment.id
        ] = images;

        window[
          "equipmentIndex_" +
          equipment.id
        ] = 0;
      }
    }
  );
}


/* ================================
   CARD
   ================================ */

function renderEquipmentCard(
  equipment
) {

  const images =
    (
      equipment.equipment_images ||
      []
    )
    .slice()
    .sort(
      (a, b) =>
        (a.sort_order || 0) -
        (b.sort_order || 0)
    );

  const firstImage =
    images.length
      ? getImageUrl(
          images[0].storage_path
        )
      : null;

  return `
    <article class="equipment-card">

      <div
        class="equipment-images"
        id="gallery-${equipment.id}"
      >

        ${
          firstImage
            ? `
              <img
                id="gallery-image-${equipment.id}"
                src="${escapeAttribute(firstImage)}"
                alt="${escapeAttribute(equipment.name)}"
              >
            `
            : `
              <div class="no-image">
                Kein Bild vorhanden
              </div>
            `
        }

        ${
          images.length > 1
            ? `
              <button
                class="image-arrow prev"
                type="button"
                onclick="changeImage('${equipment.id}', -1)"
                aria-label="Vorheriges Bild"
              >
                ‹
              </button>

              <button
                class="image-arrow next"
                type="button"
                onclick="changeImage('${equipment.id}', 1)"
                aria-label="Nächstes Bild"
              >
                ›
              </button>

              <div
                class="image-counter"
                id="image-counter-${equipment.id}"
              >
                1 / ${images.length}
              </div>
            `
            : ""
        }

      </div>

      <div class="equipment-content">

        <div class="equipment-topline">

          <div>

            <h2 class="equipment-name">
              ${escapeHtml(
                equipment.name
              )}
            </h2>

            ${
              equipment.category
                ? `
                  <span class="category">
                    ${escapeHtml(
                      equipment.category
                    )}
                  </span>
                `
                : ""
            }

          </div>

          <span
            class="status ${
              equipment.active
                ? "active"
                : "inactive"
            }"
          >
            ${
              equipment.active
                ? "Öffentlich sichtbar"
                : "Versteckt"
            }
          </span>

        </div>

        ${
          equipment.description
            ? `
              <p class="equipment-description">
                ${escapeHtml(
                  equipment.description
                )}
              </p>
            `
            : ""
        }

        <div class="equipment-actions">

          <button
            type="button"
            class="secondary-btn"
            onclick="editEquipment('${equipment.id}')"
          >
            Bearbeiten
          </button>

          <button
            type="button"
            class="secondary-btn"
            onclick="toggleEquipment('${equipment.id}')"
          >
            ${
              equipment.active
                ? "Verstecken"
                : "Aktivieren"
            }
          </button>

          <button
            type="button"
            class="danger-btn"
            onclick="deleteEquipment('${equipment.id}')"
          >
            Löschen
          </button>

        </div>

      </div>

    </article>
  `;
}


/* ================================
   IMAGE NAVIGATION
   ================================ */

function changeImage(
  id,
  direction
) {

  const images =
    window[
      "equipmentImages_" +
      id
    ];

  if (
    !images ||
    !images.length
  ) {
    return;
  }

  let index =
    window[
      "equipmentIndex_" +
      id
    ] || 0;

  index += direction;

  if (index < 0) {
    index =
      images.length - 1;
  }

  if (
    index >= images.length
  ) {
    index = 0;
  }

  window[
    "equipmentIndex_" +
    id
  ] = index;

  const image =
    document.getElementById(
      "gallery-image-" +
      id
    );

  const counter =
    document.getElementById(
      "image-counter-" +
      id
    );

  if (image) {

    image.src =
      getImageUrl(
        images[index].storage_path
      );
  }

  if (counter) {

    counter.textContent =
      `${index + 1} / ${images.length}`;
  }
}


/* ================================
   MODAL
   ================================ */

function openModal() {

  equipmentForm.reset();

  equipmentId.value = "";

  equipmentActive.checked =
    true;

  equipmentSortOrder.value =
    0;

  currentImages = [];

  pendingImageFiles = [];

  imageList.innerHTML = "";

  equipmentImages.value = "";

  modalTitle.textContent =
    "Equipment hinzufügen";

  equipmentModal.classList.add(
    "open"
  );
}


function closeModal() {

  equipmentModal.classList.remove(
    "open"
  );
}


/* ================================
   EDIT
   ================================ */

async function editEquipment(
  id
) {

  const equipment =
    equipmentData.find(
      item => item.id === id
    );

  if (!equipment) {
    return;
  }

  equipmentId.value =
    equipment.id;

  equipmentName.value =
    equipment.name || "";

  equipmentCategory.value =
    equipment.category || "";

  equipmentDescription.value =
    equipment.description || "";

  equipmentSortOrder.value =
    equipment.sort_order || 0;

  equipmentActive.checked =
    equipment.active !== false;

  currentImages =
    (
      equipment.equipment_images ||
      []
    )
    .slice()
    .sort(
      (a, b) =>
        (a.sort_order || 0) -
        (b.sort_order || 0)
    );

  pendingImageFiles = [];

  equipmentImages.value = "";

  modalTitle.textContent =
    "Equipment bearbeiten";

  renderModalImages();

  equipmentModal.classList.add(
    "open"
  );
}


/* ================================
   MODAL IMAGES
   ================================ */

function renderModalImages() {

  imageList.innerHTML = "";

  currentImages.forEach(
    (image, index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "image-item";

      item.innerHTML = `
        <img
          src="${escapeAttribute(
            getImageUrl(
              image.storage_path
            )
          )}"
          alt="Equipment Bild ${
            index + 1
          }"
        >

        <div class="image-item-controls">

          <button
            type="button"
            class="small-btn"
            ${
              index === 0
                ? "disabled"
                : ""
            }
            onclick="moveImage(${index}, -1)"
          >
            ←
          </button>

          <button
            type="button"
            class="small-btn"
            ${
              index ===
              currentImages.length - 1
                ? "disabled"
                : ""
            }
            onclick="moveImage(${index}, 1)"
          >
            →
          </button>

          <button
            type="button"
            class="small-btn delete"
            onclick="removeImage(${index})"
          >
            ×
          </button>

        </div>
      `;

      imageList.appendChild(
        item
      );
    }
  );

  pendingImageFiles.forEach(
    (file, index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "image-item";

      const previewUrl =
        URL.createObjectURL(
          file
        );

      item.innerHTML = `
        <img
          src="${previewUrl}"
          alt="Neues Bild"
        >

        <div class="image-item-controls">

          <span
            style="
              flex:1;
              font-size:12px;
              padding:7px;
              color:var(--muted);
            "
          >
            Neues Bild
          </span>

          <button
            type="button"
            class="small-btn delete"
            onclick="removePendingImage(${index})"
          >
            ×
          </button>

        </div>
      `;

      imageList.appendChild(
        item
      );
    }
  );
}


/* ================================
   MOVE IMAGE
   ================================ */

function moveImage(
  index,
  direction
) {

  const newIndex =
    index + direction;

  if (
    newIndex < 0 ||
    newIndex >=
      currentImages.length
  ) {
    return;
  }

  [
    currentImages[index],
    currentImages[newIndex]
  ] = [
    currentImages[newIndex],
    currentImages[index]
  ];

  renderModalImages();
}


/* ================================
   REMOVE IMAGE
   ================================ */

async function removeImage(
  index
) {

  const image =
    currentImages[index];

  if (!image) {
    return;
  }

  if (
    !confirm(
      "Dieses Bild wirklich löschen?"
    )
  ) {
    return;
  }

  const {
    error
  } = await supabaseClient
    .storage
    .from(STORAGE_BUCKET)
    .remove([
      image.storage_path
    ]);

  if (error) {

    console.error(error);

    showMessage(
      "Bild konnte nicht gelöscht werden.",
      "error"
    );

    return;
  }

  const {
    error: dbError
  } = await supabaseClient
    .from("equipment_images")
    .delete()
    .eq("id", image.id);

  if (dbError) {

    console.error(dbError);

    showMessage(
      "Bild wurde aus dem Speicher entfernt, konnte aber nicht aus der Datenbank gelöscht werden.",
      "error"
    );

    return;
  }

  currentImages.splice(
    index,
    1
  );

  renderModalImages();

  showMessage(
    "Bild gelöscht."
  );
}


/* ================================
   REMOVE NEW IMAGE
   ================================ */

function removePendingImage(
  index
) {

  pendingImageFiles.splice(
    index,
    1
  );

  renderModalImages();
}


/* ================================
   NEW IMAGES
   ================================ */

equipmentImages.addEventListener(
  "change",
  function () {

    const files =
      Array.from(
        this.files || []
      );

    for (
      const file of files
    ) {

      if (
        file.size >
        10 * 1024 * 1024
      ) {

        showMessage(
          `${file.name} ist größer als 10 MB.`,
          "error"
        );

        continue;
      }

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif"
      ];

      if (
        !allowedTypes.includes(
          file.type
        )
      ) {

        showMessage(
          `${file.name} ist kein unterstütztes Bildformat.`,
          "error"
        );

        continue;
      }

      pendingImageFiles.push(
        file
      );
    }

    this.value = "";

    renderModalImages();
  }
);


/* ================================
   SAVE
   ================================ */

equipmentForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    saveBtn.disabled = true;

    saveBtn.textContent =
      "Speichert …";

    try {

      const id =
        equipmentId.value.trim();

      const payload = {

        name:
          equipmentName.value.trim(),

        category:
          equipmentCategory.value.trim() ||
          null,

        description:
          equipmentDescription.value.trim() ||
          null,

        active:
          equipmentActive.checked,

        sort_order:
          parseInt(
            equipmentSortOrder.value,
            10
          ) || 0,

        updated_at:
          new Date().toISOString()
      };

      if (!payload.name) {

        throw new Error(
          "Bitte einen Namen eingeben."
        );
      }


      /* UPDATE */

      if (id) {

        const {
          error
        } = await supabaseClient
          .from("equipment")
          .update(payload)
          .eq("id", id);

        if (error) {
          throw error;
        }

      }


      /* INSERT */

      else {

        const {
          data,
          error
        } = await supabaseClient
          .from("equipment")
          .insert(payload)
          .select()
          .single();

        if (error) {
          throw error;
        }

        equipmentId.value =
          data.id;
      }


      const savedEquipmentId =
        equipmentId.value;


      /* UPLOAD */

      if (
        pendingImageFiles.length
      ) {

        let nextSortOrder =
          currentImages.length;

        for (
          const file
          of pendingImageFiles
        ) {

          const extension =
            file.name
              .split(".")
              .pop()
              .toLowerCase();

          const uniqueName =
            `${crypto.randomUUID()}.${extension}`;

          const storagePath =
            `${savedEquipmentId}/${uniqueName}`;

          const {
            error: uploadError
          } = await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .upload(
              storagePath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );

          if (uploadError) {
            throw uploadError;
          }

          const {
            error: imageDbError
          } = await supabaseClient
            .from("equipment_images")
            .insert({
              equipment_id:
                savedEquipmentId,

              storage_path:
                storagePath,

              sort_order:
                nextSortOrder
            });

          if (imageDbError) {
            throw imageDbError;
          }

          nextSortOrder++;
        }
      }


      /* IMAGE ORDER */

      for (
        let index = 0;
        index < currentImages.length;
        index++
      ) {

        await supabaseClient
          .from("equipment_images")
          .update({
            sort_order: index
          })
          .eq(
            "id",
            currentImages[index].id
          );
      }

      showMessage(
        "Equipment erfolgreich gespeichert."
      );

      closeModal();

      await loadEquipment();

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Beim Speichern ist ein Fehler aufgetreten.",
        "error"
      );

    } finally {

      saveBtn.disabled = false;

      saveBtn.textContent =
        "Speichern";
    }
  }
);


/* ================================
   TOGGLE
   ================================ */

async function toggleEquipment(
  id
) {

  const equipment =
    equipmentData.find(
      item => item.id === id
    );

  if (!equipment) {
    return;
  }

  const {
    error
  } = await supabaseClient
    .from("equipment")
    .update({
      active:
        !equipment.active,

      updated_at:
        new Date().toISOString()
    })
    .eq("id", id);

  if (error) {

    console.error(error);

    showMessage(
      "Status konnte nicht geändert werden.",
      "error"
    );

    return;
  }

  showMessage(
    equipment.active
      ? "Equipment wurde versteckt."
      : "Equipment wurde aktiviert."
  );

  await loadEquipment();
}


/* ================================
   DELETE
   ================================ */

async function deleteEquipment(
  id
) {

  const equipment =
    equipmentData.find(
      item => item.id === id
    );

  if (!equipment) {
    return;
  }

  if (
    !confirm(
      `„${equipment.name}“ wirklich löschen?\n\nDabei werden auch alle zugehörigen Bilder gelöscht.`
    )
  ) {
    return;
  }

  try {

    const images =
      equipment.equipment_images ||
      [];

    if (images.length) {

      const paths =
        images.map(
          image =>
            image.storage_path
        );

      const {
        error: storageError
      } = await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .remove(paths);

      if (storageError) {
        throw storageError;
      }
    }

    const {
      error
    } = await supabaseClient
      .from("equipment")
      .delete()
      .eq("id", id);

    if (error) {
      throw error;
    }

    showMessage(
      "Equipment gelöscht."
    );

    await loadEquipment();

  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Equipment konnte nicht gelöscht werden.",
      "error"
    );
  }
}


/* ================================
   HELPERS
   ================================ */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function escapeAttribute(
  value
) {

  return escapeHtml(value);
}
