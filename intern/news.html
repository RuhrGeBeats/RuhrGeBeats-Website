<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>News verwalten – RuhrGeBeats</title>

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <link
    rel="icon"
    href="../logo.png"
  >

  <link
    rel="stylesheet"
    href="./intern.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <style>

    /* =========================================
       NEWS PAGE
    ========================================== */

    .news-page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 42px 24px 80px;
    }


    .news-page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }


    .news-page-head-left {
      min-width: 0;
    }


    .news-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      color: #64748b;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }


    .news-back:hover {
      color: #168cff;
    }


    .news-eyebrow {
      margin-bottom: 8px;
      color: #168cff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }


    .news-page h1 {
      margin: 0;
      color: #07111f;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.05;
      letter-spacing: -1.5px;
    }


    .news-page-intro {
      max-width: 700px;
      margin-top: 14px;
      color: #64748b;
      font-size: 15px;
      line-height: 1.7;
    }


    .news-create-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #168cff;
      color: white;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(22, 140, 255, .18);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    .news-create-button:hover {
      background: #0879e6;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(22, 140, 255, .24);
    }


    /* =========================================
       STATUS
    ========================================== */

    .news-status-message {
      display: none;
      margin-bottom: 24px;
      padding: 14px 17px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 700;
    }


    .news-status-message.success {
      display: block;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
    }


    .news-status-message.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }


    /* =========================================
       EDITOR
    ========================================== */

    .news-editor {
      display: none;
      margin-bottom: 36px;
      padding: 30px;
      border: 1px solid #dfe5ec;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(15, 23, 42, .06);
    }


    .news-editor.visible {
      display: block;
    }


    .news-editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }


    .news-editor-head h2 {
      margin: 0;
      color: #07111f;
      font-size: 22px;
    }


    .news-editor-close {
      width: 38px;
      height: 38px;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      background: #ffffff;
      color: #64748b;
      font-size: 20px;
      cursor: pointer;
    }


    .news-editor-close:hover {
      color: #07111f;
      background: #f8fafc;
    }


    .news-form-group {
      margin-bottom: 20px;
    }


    .news-form-group label {
      display: block;
      margin-bottom: 8px;
      color: #172033;
      font-size: 13px;
      font-weight: 800;
    }


    .news-form-group input,
    .news-form-group textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d8e0e8;
      border-radius: 11px;
      background: #ffffff;
      color: #172033;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }


    .news-form-group input {
      min-height: 46px;
      padding: 0 14px;
    }


    .news-form-group textarea {
      min-height: 150px;
      padding: 13px 14px;
      resize: vertical;
      line-height: 1.6;
    }


    .news-form-group input:focus,
    .news-form-group textarea:focus {
      border-color: #168cff;
      box-shadow: 0 0 0 3px rgba(22, 140, 255, .10);
    }


    /* =========================================
       UPLOAD
    ========================================== */

    .upload-area {
      border: 1.5px dashed #cbd5e1;
      border-radius: 14px;
      padding: 26px 20px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition:
        border-color .2s ease,
        background .2s ease;
    }


    .upload-area:hover,
    .upload-area.dragover {
      border-color: #168cff;
      background: #f0f8ff;
    }


    .upload-area-icon {
      margin-bottom: 8px;
      font-size: 28px;
    }


    .upload-area strong {
      display: block;
      margin-bottom: 5px;
      color: #172033;
      font-size: 14px;
    }


    .upload-area span {
      color: #64748b;
      font-size: 12px;
    }


    #imageInput {
      display: none;
    }


    .selected-images {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }


    .selected-image {
      position: relative;
      overflow: hidden;
      border-radius: 11px;
      aspect-ratio: 16 / 10;
      background: #e2e8f0;
    }


    .selected-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    .selected-image-remove {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(7, 17, 31, .82);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }


    /* =========================================
       EDITOR ACTIONS
    ========================================== */

    .news-editor-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }


    .news-secondary-button,
    .news-primary-button {
      min-height: 44px;
      padding: 0 17px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }


    .news-secondary-button {
      border: 1px solid #dbe2ea;
      background: #ffffff;
      color: #475569;
    }


    .news-secondary-button:hover {
      background: #f8fafc;
    }


    .news-primary-button {
      border: 0;
      background: #168cff;
      color: white;
    }


    .news-primary-button:hover {
      background: #0879e6;
    }


    /* =========================================
       EXISTING NEWS
    ========================================== */

    .existing-news-heading {
      margin-bottom: 18px;
    }


    .existing-news-heading h2 {
      margin: 0;
      color: #07111f;
      font-size: 22px;
    }


    .existing-news {
      display: grid;
      gap: 18px;
    }


    .news-card {
      overflow: hidden;
      border: 1px solid #dfe5ec;
      border-radius: 17px;
      background: white;
      box-shadow: 0 8px 25px rgba(15, 23, 42, .045);
    }


    .news-card-images {
      display: grid;
      width: 100%;
    }


    .news-card-images.single {
      grid-template-columns: 1fr;
    }


    .news-card-images.double,
    .news-card-images.multiple {
      grid-template-columns: 1fr 1fr;
    }


    .news-card-image {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #e2e8f0;
    }


    .news-card-body {
      padding: 23px;
    }


    .news-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }


    .news-card-date {
      margin-bottom: 7px;
      color: #168cff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }


    .news-card h3 {
      margin: 0;
      color: #07111f;
      font-size: 21px;
      line-height: 1.25;
    }


    .news-card-content {
      margin-top: 13px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-line;
    }


    .news-card-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }


    .news-card-button {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid #dbe2ea;
      border-radius: 9px;
      background: #ffffff;
      color: #475569;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }


    .news-card-button:hover {
      background: #f8fafc;
      color: #07111f;
    }


    .news-card-button.publish {
      border-color: #b9e6d2;
      background: #ecfdf5;
      color: #047857;
    }


    .news-card-button.unpublish {
      border-color: #fde68a;
      background: #fffbeb;
      color: #a16207;
    }


    .news-card-button.delete {
      border-color: #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }


    .news-status {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .8px;
      text-transform: uppercase;
    }


    .news-status.published {
      background: #ecfdf5;
      color: #047857;
    }


    .news-status.draft {
      background: #f1f5f9;
      color: #64748b;
    }


    .empty-news {
      padding: 45px 25px;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      background: #f8fafc;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }


    /* =========================================
       AUTH CHECK
    ========================================== */

    body.auth-checking > * {
      visibility: hidden;
    }


    body.auth-checking::before {
      content: "Anmeldung wird geprüft …";
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      color: #172033;
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 15px;
      z-index: 99999;
    }


    /* =========================================
       RESPONSIVE
    ========================================== */

    @media (max-width: 760px) {

      .news-page {
        padding: 30px 17px 60px;
      }


      .news-page-head {
        align-items: stretch;
        flex-direction: column;
      }


      .news-create-button {
        width: 100%;
      }


      .news-editor {
        padding: 21px;
      }


      .selected-images {
        grid-template-columns: 1fr 1fr;
      }


      .news-card-top {
        flex-direction: column;
        gap: 12px;
      }


      .news-card-actions {
        flex-direction: column;
        align-items: stretch;
      }


      .news-card-button {
        width: 100%;
      }

    }

  </style>

</head>

    body.auth-checking > * {

    }

    body.auth-checking::before {
      content: "Anmeldung wird geprüft …";
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      color: #172033;
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 15px;
      z-index: 99999;
    }
  </style>


  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="intern-header">

    <div class="intern-header-inner">

      <a
        href="./dashboard.html"
        class="intern-logo"
      >
        <img
          src="../logo.png"
          alt="RuhrGeBeats"
        >
      </a>


      <div class="intern-header-right">

        <span
          id="userEmail"
          class="intern-user"
        ></span>

        <a
          href="../"
          class="intern-public-link"
        >
          Zur Website
        </a>

      </div>

    </div>

  </header>


  <!-- =========================================
       MAIN
  ========================================== -->

  <main class="news-page">

    <div class="news-page-head">

      <div class="news-page-head-left">

        <a
          href="./dashboard.html"
          class="news-back"
        >
          ← Zum Dashboard
        </a>

        <div class="news-eyebrow">
          Interner Bereich
        </div>

        <h1>
          News verwalten
        </h1>

        <p class="news-page-intro">
          Öffentliche Neuigkeiten von RuhrGeBeats
          erstellen, bearbeiten und veröffentlichen.
        </p>

      </div>


      <button
        type="button"
        class="news-create-button"
        id="createNewsButton"
      >
        + Neue News
      </button>

    </div>


    <div
      id="statusMessage"
      class="news-status-message"
    ></div>


    <!-- =========================================
         EDITOR
    ========================================== -->

    <section
      class="news-editor"
      id="newsEditor"
    >

      <div class="news-editor-head">

        <h2 id="editorTitle">
          Neue News
        </h2>

        <button
          type="button"
          class="news-editor-close"
          id="closeEditorButton"
          aria-label="Editor schließen"
        >
          ×
        </button>

      </div>


      <div class="news-form-group">

        <label for="newsTitle">
          Überschrift
        </label>

        <input
          type="text"
          id="newsTitle"
          placeholder="z. B. Neue Technik bei RuhrGeBeats"
          maxlength="180"
        >

      </div>


      <div class="news-form-group">

        <label for="newsContent">
          Inhalt
        </label>

        <textarea
          id="newsContent"
          placeholder="Schreibt hier eure Neuigkeit..."
        ></textarea>

      </div>


      <div class="news-form-group">

        <label>
          Bilder
        </label>

        <div
          class="upload-area"
          id="uploadArea"
        >

          <div class="upload-area-icon">
            📷
          </div>

          <strong>
            Bilder auswählen oder hierher ziehen
          </strong>

          <span>
            JPEG, PNG, WEBP oder GIF · maximal 10 MB pro Bild
          </span>

        </div>


        <input
          type="file"
          id="imageInput"
          accept="image/jpeg,image/png,image/webp,image/gif"
          multiple
        >


        <div
          class="selected-images"
          id="selectedImages"
        ></div>

      </div>


      <div class="news-editor-actions">

        <button
          type="button"
          class="news-secondary-button"
          id="cancelEditButton"
        >
          Abbrechen
        </button>

        <button
          type="button"
          class="news-primary-button"
          id="saveNewsButton"
        >
          News speichern
        </button>

      </div>

    </section>


    <!-- =========================================
         EXISTING NEWS
    ========================================== -->

    <div class="existing-news-heading">

      <h2>
        Vorhandene News
      </h2>

    </div>


    <section
      id="existingNews"
      class="existing-news"
    ></section>

  </main>


  <script>

    /* =========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://spqsuedpmrxcbefpocho.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_m-jonK9Ca3K10OKxaorcgQ_9P5OhVGr";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       ELEMENTE
    ========================================== */

    const createNewsButton =
      document.getElementById(
        "createNewsButton"
      );


    const closeEditorButton =
      document.getElementById(
        "closeEditorButton"
      );


    const cancelEditButton =
      document.getElementById(
        "cancelEditButton"
      );


    const saveNewsButton =
      document.getElementById(
        "saveNewsButton"
      );


    const newsEditor =
      document.getElementById(
        "newsEditor"
      );


    const editorTitle =
      document.getElementById(
        "editorTitle"
      );


    const newsTitle =
      document.getElementById(
        "newsTitle"
      );


    const newsContent =
      document.getElementById(
        "newsContent"
      );


    const statusMessage =
      document.getElementById(
        "statusMessage"
      );


    const existingNews =
      document.getElementById(
        "existingNews"
      );


    const uploadArea =
      document.getElementById(
        "uploadArea"
      );


    const imageInput =
      document.getElementById(
        "imageInput"
      );


    const selectedImages =
      document.getElementById(
        "selectedImages"
      );


    /* =========================================
       STATE
    ========================================== */

    let editingNewsId = null;

    let selectedFiles = [];

    let existingImageUrls = [];


    /* =========================================
       STATUS
    ========================================== */

    function showStatus(
      message,
      type
    ) {

      statusMessage.textContent =
        message;

      statusMessage.className =
        "news-status-message " + type;

    }


    /* =========================================
       LOGIN / AUTHENTICATION
    ========================================== */

    async function checkSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .getSession();


        if (
          error ||
          !data ||
          !data.session
        ) {

          window.location.replace("./");

          return null;

        }


        const userEmail =
          document.getElementById(
            "userEmail"
          );


        if (userEmail) {

          userEmail.textContent =
            data.session.user.email || "";

        }


        /*
          Erst wenn eine gültige Session
          vorhanden ist, wird der Seiteninhalt
          sichtbar.
        */

        document.body.classList.remove(
          "auth-checking"
        );


        return data.session;

      } catch (error) {

        console.error(
          "Fehler bei der Session-Prüfung:",
          error
        );


        window.location.replace("./");

        return null;

      }

    }


    /* =========================================
       EDITOR ÖFFNEN
    ========================================== */

    function openEditor(
      news = null
    ) {

      newsEditor.classList.add(
        "visible"
      );


      if (news) {

        editingNewsId =
          news.id;


        editorTitle.textContent =
          "News bearbeiten";


        newsTitle.value =
          news.title || "";


        newsContent.value =
          news.content || "";


        existingImageUrls =
          Array.isArray(
            news.image_urls
          )
            ? [...news.image_urls]
            : [];


        selectedFiles = [];

        renderSelectedImages();

      } else {

        editingNewsId = null;

        selectedFiles = [];

        existingImageUrls = [];

        editorTitle.textContent =
          "Neue News";


        newsTitle.value =
          "";


        newsContent.value =
          "";


        renderSelectedImages();

      }


      newsEditor.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    /* =========================================
       EDITOR SCHLIESSEN
    ========================================== */

    function closeEditor() {

      newsEditor.classList.remove(
        "visible"
      );


      editingNewsId = null;

      selectedFiles = [];

      existingImageUrls = [];

      newsTitle.value = "";

      newsContent.value = "";

      renderSelectedImages();

    }


    /* =========================================
       UPLOAD AREA
    ========================================== */

    uploadArea.addEventListener(
      "click",
      () => {

        imageInput.click();

      }
    );


    uploadArea.addEventListener(
      "dragover",
      event => {

        event.preventDefault();

        uploadArea.classList.add(
          "dragover"
        );

      }
    );


    uploadArea.addEventListener(
      "dragleave",
      () => {

        uploadArea.classList.remove(
          "dragover"
        );

      }
    );


    uploadArea.addEventListener(
      "drop",
      event => {

        event.preventDefault();

        uploadArea.classList.remove(
          "dragover"
        );


        const files =
          Array.from(
            event.dataTransfer.files
          );


        addSelectedFiles(
          files
        );

      }
    );


    imageInput.addEventListener(
      "change",
      () => {

        const files =
          Array.from(
            imageInput.files
          );


        addSelectedFiles(
          files
        );


        imageInput.value = "";

      }
    );


    /* =========================================
       DATEI PRÜFEN
    ========================================== */

    function addSelectedFiles(
      files
    ) {

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif"
      ];


      files.forEach(
        file => {

          if (
            !allowedTypes.includes(
              file.type
            )
          ) {

            showStatus(
              "Nur JPEG, PNG, WEBP und GIF sind erlaubt.",
              "error"
            );

            return;

          }


          if (
            file.size >
            10 * 1024 * 1024
          ) {

            showStatus(
              "Ein Bild ist größer als 10 MB.",
              "error"
            );

            return;

          }


          selectedFiles.push(
            file
          );

        }
      );


      renderSelectedImages();

    }


    /* =========================================
       BILDER RENDERN
    ========================================== */

    function renderSelectedImages() {

      selectedImages.innerHTML =
        "";


      existingImageUrls.forEach(
        (
          image,
          index
        ) => {

          const wrapper =
            document.createElement(
              "div"
            );


          wrapper.className =
            "selected-image";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            image.url;


          img.alt =
            "News Bild";


          const remove =
            document.createElement(
              "button"
            );


          remove.type =
            "button";


          remove.className =
            "selected-image-remove";


          remove.textContent =
            "×";


          remove.addEventListener(
            "click",
            () => {

              existingImageUrls.splice(
                index,
                1
              );


              renderSelectedImages();

            }
          );


          wrapper.appendChild(
            img
          );


          wrapper.appendChild(
            remove
          );


          selectedImages.appendChild(
            wrapper
          );

        }
      );


      selectedFiles.forEach(
        (
          file,
          index
        ) => {

          const wrapper =
            document.createElement(
              "div"
            );


          wrapper.className =
            "selected-image";


          const img =
            document.createElement(
              "img"
            );


          img.alt =
            file.name;


          const remove =
            document.createElement(
              "button"
            );


          remove.type =
            "button";


          remove.className =
            "selected-image-remove";


          remove.textContent =
            "×";


          remove.addEventListener(
            "click",
            () => {

              selectedFiles.splice(
                index,
                1
              );


              renderSelectedImages();

            }
          );


          const reader =
            new FileReader();


          reader.onload =
            event => {

              img.src =
                event.target.result;

            };


          reader.readAsDataURL(
            file
          );


          wrapper.appendChild(
            img
          );


          wrapper.appendChild(
            remove
          );


          selectedImages.appendChild(
            wrapper
          );

        }
      );

    }


    /* =========================================
       BILDER HOCHLADEN
    ========================================== */

    async function uploadImages() {

      const uploadedImages =
        [...existingImageUrls];


      for (
        const file
        of selectedFiles
      ) {

        const extension =
          file.name
            .split(".")
            .pop()
            .toLowerCase();


        const randomPart =
          Math.random()
            .toString(36)
            .substring(2);


        const path =
          `${Date.now()}-${randomPart}.${extension}`;


        const {
          error
        } =
          await supabaseClient
            .storage
            .from("news-images")
            .upload(
              path,
              file,
              {
                cacheControl:
                  "3600",

                upsert:
                  false,

                contentType:
                  file.type
              }
            );


        if (error) {

          console.error(
            error
          );


          throw new Error(
            "Ein Bild konnte nicht hochgeladen werden."
          );

        }


        const {
          data
        } =
          supabaseClient
            .storage
            .from("news-images")
            .getPublicUrl(
              path
            );


        uploadedImages.push({
          url:
            data.publicUrl,

          path:
            path
        });

      }


      return uploadedImages;

    }


    /* =========================================
       NEWS LADEN
    ========================================== */

    async function loadNews() {

      existingNews.innerHTML =
        `
          <div class="empty-news">
            News werden geladen …
          </div>
        `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("news")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          error
        );


        existingNews.innerHTML =
          `
            <div class="empty-news">
              Die News konnten nicht geladen werden.
            </div>
          `;


        showStatus(
          "Die News konnten nicht geladen werden.",
          "error"
        );


        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        existingNews.innerHTML =
          `
            <div class="empty-news">
              Noch keine News vorhanden.
            </div>
          `;


        return;

      }


      existingNews.innerHTML =
        data
          .map(
            news =>
              renderNewsCard(
                news
              )
          )
          .join("");

    }


    /* =========================================
       HTML ESCAPEN
    ========================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================
       DATUM FORMATIEREN
    ========================================== */

    function formatDate(
      dateString
    ) {

      if (!dateString) {
        return "";
      }


      return new Date(
        dateString
      ).toLocaleDateString(
        "de-DE",
        {
          day:
            "2-digit",

          month:
            "long",

          year:
            "numeric"
        }
      );

    }


    /* =========================================
       NEWS CARD
    ========================================== */

    function renderNewsCard(
      news
    ) {

      const images =
        Array.isArray(
          news.image_urls
        )
          ? news.image_urls
          : [];


      let imageHtml =
        "";


      if (
        images.length
      ) {

        const layoutClass =
          images.length === 1
            ? "single"
            : images.length === 2
              ? "double"
              : "multiple";


        imageHtml =
          `
            <div
              class="news-card-images ${layoutClass}"
            >

              ${images
                .map(
                  image =>
                    `
                      <img
                        class="news-card-image"
                        src="${escapeHtml(
                          image.url
                        )}"
                        alt="News Bild"
                      >
                    `
                )
                .join("")}

            </div>
          `;

      }


      return `
        <article class="news-card">

          ${imageHtml}

          <div class="news-card-body">

            <div class="news-card-top">

              <div>

                <div class="news-card-date">
                  ${formatDate(
                    news.published_at ||
                    news.created_at
                  )}
                </div>

                <h3>
                  ${escapeHtml(
                    news.title
                  )}
                </h3>

              </div>


              <span
                class="news-status ${
                  news.published
                    ? "published"
                    : "draft"
                }"
              >
                ${
                  news.published
                    ? "Veröffentlicht"
                    : "Entwurf"
                }
              </span>

            </div>


            <div class="news-card-content">
              ${escapeHtml(
                news.content
              )}
            </div>


            <div class="news-card-actions">

              <button
                type="button"
                class="news-card-button"
                onclick="editNews('${news.id}')"
              >
                Bearbeiten
              </button>


              <button
                type="button"
                class="news-card-button ${
                  news.published
                    ? "unpublish"
                    : "publish"
                }"
                onclick="togglePublished(
                  '${news.id}',
                  ${news.published ? "true" : "false"}
                )"
              >
                ${
                  news.published
                    ? "Veröffentlichung zurücknehmen"
                    : "Veröffentlichen"
                }
              </button>


              <button
                type="button"
                class="news-card-button delete"
                onclick="deleteNews('${news.id}')"
              >
                Löschen
              </button>

            </div>

          </div>

        </article>
      `;

    }


    /* =========================================
       NEWS ERSTELLEN
    ========================================== */

    createNewsButton.addEventListener(
      "click",
      () => {

        openEditor();

      }
    );


    closeEditorButton.addEventListener(
      "click",
      () => {

        closeEditor();

      }
    );


    cancelEditButton.addEventListener(
      "click",
      () => {

        closeEditor();

      }
    );


    /* =========================================
       NEWS SPEICHERN
    ========================================== */

    saveNewsButton.addEventListener(
      "click",
      async () => {

        const title =
          newsTitle.value.trim();


        const content =
          newsContent.value.trim();


        if (!title) {

          showStatus(
            "Bitte eine Überschrift eingeben.",
            "error"
          );

          return;

        }


        if (!content) {

          showStatus(
            "Bitte einen Inhalt eingeben.",
            "error"
          );

          return;

        }


        saveNewsButton.disabled =
          true;


        saveNewsButton.textContent =
          "Wird gespeichert …";


        try {

          const imageUrls =
            await uploadImages();


          const now =
            new Date().toISOString();


          if (
            editingNewsId
          ) {

            const {
              error
            } =
              await supabaseClient
                .from("news")
                .update({

                  title:
                    title,

                  content:
                    content,

                  image_urls:
                    imageUrls,

                  updated_at:
                    now

                })
                .eq(
                  "id",
                  editingNewsId
                );


            if (error) {

              throw error;

            }


            showStatus(
              "News wurde erfolgreich aktualisiert.",
              "success"
            );

          } else {

            const {
              error
            } =
              await supabaseClient
                .from("news")
                .insert({

                  title:
                    title,

                  content:
                    content,

                  image_urls:
                    imageUrls,

                  published:
                    false,

                  published_at:
                    null,

                  created_at:
                    now,

                  updated_at:
                    now

                });


            if (error) {

              throw error;

            }


            showStatus(
              "News wurde erfolgreich erstellt.",
              "success"
            );

          }


          closeEditor();

          await loadNews();

        } catch (error) {

          console.error(
            error
          );


          showStatus(
            "Die News konnte nicht gespeichert werden.",
            "error"
          );

        } finally {

          saveNewsButton.disabled =
            false;


          saveNewsButton.textContent =
            "News speichern";

        }

      }
    );


    /* =========================================
       NEWS BEARBEITEN
    ========================================== */

    window.editNews =
      async function(
        id
      ) {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("news")
            .select("*")
            .eq(
              "id",
              id
            )
            .single();


        if (error) {

          console.error(
            error
          );


          showStatus(
            "Die News konnte nicht geladen werden.",
            "error"
          );


          return;

        }


        openEditor(
          data
        );

      };


    /* =========================================
       VERÖFFENTLICHUNG ÄNDERN
    ========================================== */

    window.togglePublished =
      async function(
        id,
        currentlyPublished
      ) {


        const newValue =
          !currentlyPublished;


        const {
          error
        } =
          await supabaseClient
            .from("news")
            .update({

              published:
                newValue,

              published_at:
                newValue
                  ? new Date().toISOString()
                  : null,

              updated_at:
                new Date().toISOString()

            })
            .eq(
              "id",
              id
            );


        if (error) {

          console.error(
            error
          );


          showStatus(
            "Die Veröffentlichung konnte nicht geändert werden.",
            "error"
          );


          return;

        }


        showStatus(
          newValue
            ? "News wurde veröffentlicht."
            : "Veröffentlichung wurde zurückgenommen.",
          "success"
        );


        loadNews();

      };


    /* =========================================
       NEWS LÖSCHEN
    ========================================== */

    window.deleteNews =
      async function(
        id
      ) {


        const confirmed =
          confirm(
            "Soll diese News wirklich gelöscht werden?"
          );


        if (!confirmed) {
          return;
        }


        /*
          Zuerst Bildpfade laden,
          damit auch die Bilder gelöscht werden.
        */

        const {
          data: news
        } =
          await supabaseClient
            .from("news")
            .select("image_urls")
            .eq(
              "id",
              id
            )
            .single();


        /*
          News löschen
        */

        const {
          error
        } =
          await supabaseClient
            .from("news")
            .delete()
            .eq(
              "id",
              id
            );


        if (error) {

          console.error(
            error
          );


          showStatus(
            "Die News konnte nicht gelöscht werden.",
            "error"
          );


          return;

        }


        /*
          Zugehörige Bilder löschen
        */

        if (
          news &&
          Array.isArray(
            news.image_urls
          )
        ) {

          const paths =
            news.image_urls
              .map(
                image =>
                  image.path
              )
              .filter(
                Boolean
              );


          if (
            paths.length
          ) {

            await supabaseClient
              .storage
              .from("news-images")
              .remove(
                paths
              );

          }

        }


        showStatus(
          "News wurde gelöscht.",
          "success"
        );


        loadNews();

      };


    /* =========================================
       START
       AUTHENTIFIZIERUNG ZUERST
    ========================================== */

    (async () => {

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .getSession();


        /*
          Keine gültige Session:
          niemals den News-Bereich anzeigen.
        */

        if (
          error ||
          !data ||
          !data.session
        ) {

          window.location.replace("./");

          return;

        }


        /*
          Angemeldeten Benutzer anzeigen.
        */

        const userEmail =
          document.getElementById(
            "userEmail"
          );


        if (userEmail) {

          userEmail.textContent =
            data.session.user.email || "";

        }


        /*
          Erst jetzt wird die Seite sichtbar.
        */

        document.body.classList.remove(
          "auth-checking"
        );


        /*
          Und erst jetzt werden
          die News aus Supabase geladen.
        */

        await loadNews();

      } catch (error) {

        console.error(
          "Fehler bei der Session-Prüfung:",
          error
        );


        window.location.replace("./");

      }

    })();

  </script>
