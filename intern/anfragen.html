<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anfragen – RuhrGeBeats</title>

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <link
    rel="icon"
    href="../logo.png"
  >

  <link
    rel="stylesheet"
    href="./intern.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <style>

    /* =========================================
       ANFRAGEN
       ========================================= */

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .page-header h1 {
      margin: 8px 0 5px;
      font-size: clamp(32px, 5vw, 46px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .page-header p {
      margin: 0;
      color: var(--muted);
    }

    .back-dashboard {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 9px 15px;

      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;

      font-size: 13px;
      font-weight: 700;

      transition: .2s ease;
    }

    .back-dashboard:hover {
      border-color: #b8dcfa;
      color: var(--blue-dark);
    }


    /* =========================================
       STATUS
       ========================================= */

    .request-status {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 20px;

      color: var(--muted);
      text-align: center;

      margin-bottom: 20px;
    }


    .request-status.error {
      color: var(--danger);
      background: #fff6f6;
      border-color: #f0caca;
    }


    /* =========================================
       REQUEST CARD
       ========================================= */

    .requests-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }


    .request-card {
      background: var(--white);

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow:
        0 15px 40px rgba(7,17,31,.06);

      overflow: hidden;
    }


    .request-top {
      padding: 24px 26px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      border-bottom: 1px solid var(--border);
    }


    .request-title {
      margin: 0;

      font-size: 22px;
      letter-spacing: -.025em;
    }


    .request-type {
      margin-top: 4px;

      color: var(--blue-dark);

      font-size: 13px;
      font-weight: 800;
    }


    .request-date {
      flex-shrink: 0;

      padding: 6px 11px;

      background: #eaf5ff;
      color: var(--blue-dark);

      border-radius: 999px;

      font-size: 12px;
      font-weight: 800;
    }


    .request-body {
      padding: 25px 26px;
    }


    /* =========================================
       DATA GRID
       ========================================= */

    .request-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 24px;
    }


    .request-section {
      min-width: 0;
    }


    .request-section.full {
      grid-column: 1 / -1;
    }


    .request-section h3 {
      margin: 0 0 12px;

      font-size: 13px;

      text-transform: uppercase;
      letter-spacing: .08em;

      color: var(--muted);
    }


    .request-info {
      display: flex;
      flex-direction: column;
      gap: 7px;

      font-size: 14px;
    }


    .request-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }


    .request-label {
      flex: 0 0 125px;

      color: var(--muted);
      font-size: 13px;
    }


    .request-value {
      min-width: 0;

      font-weight: 650;

      overflow-wrap: anywhere;
    }


    .request-value a {
      color: var(--blue-dark);
    }


    .request-value a:hover {
      text-decoration: underline;
    }


    /* =========================================
       MESSAGE
       ========================================= */

    .request-message {
      padding: 16px;

      background: var(--light);

      border-radius: 13px;

      color: #3f4b57;

      font-size: 14px;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }


    .request-message.empty {
      color: var(--muted);
      font-style: italic;
    }


    /* =========================================
       REQUEST META
       ========================================= */

    .request-meta {
      padding: 13px 26px;

      background: #fafbfc;

      border-top: 1px solid var(--border);

      color: var(--muted);

      font-size: 11px;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 700px) {

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }


      .request-top {
        padding: 21px;
        flex-direction: column;
      }


      .request-body {
        padding: 21px;
      }


      .request-grid {
        grid-template-columns: 1fr;
        gap: 25px;
      }


      .request-section.full {
        grid-column: auto;
      }


      .request-label {
        flex-basis: 105px;
      }


      .request-meta {
        padding: 13px 21px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header class="intern-header">

    <div class="intern-header-inner">

      <a
        href="./dashboard.html"
        class="intern-logo"
      >

        <img
          src="../logo.png"
          alt="RuhrGeBeats"
        >

      </a>


      <div class="intern-header-right">

        <span
          id="userEmail"
          class="intern-user"
        ></span>


        <a
          href="../"
          class="intern-public-link"
        >
          Zur Website
        </a>

      </div>

    </div>

  </header>



  <!-- MAIN -->

  <main class="intern-layout">


    <!-- PAGE HEADER -->

    <section class="page-header">

      <div>

        <div class="intern-eyebrow">
          Interner Bereich
        </div>

        <h1>
          Anfragen
        </h1>

        <p>
          Eingegangene Veranstaltungsanfragen von eurer Website.
        </p>

      </div>


      <a
        href="./dashboard.html"
        class="back-dashboard"
      >
        ← Dashboard
      </a>

    </section>



    <!-- STATUS -->

    <div
      id="requestStatus"
      class="request-status"
    >
      Anfragen werden geladen …
    </div>



    <!-- REQUESTS -->

    <section
      id="requestsList"
      class="requests-list"
    ></section>


  </main>



  <!-- FOOTER -->

  <footer class="intern-footer">

    <span>
      RuhrGeBeats GbR · Interner Bereich
    </span>


    <button
      type="button"
      id="logoutButton"
      class="logout-button"
    >
      Abmelden
    </button>

  </footer>



  <!-- SUPABASE -->

  <script>

    const SUPABASE_URL =
      "https://spqsuedpmrxcbefpocho.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_m-jonK9Ca3K10OKxaorcgQ_9P5OhVGr";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const requestStatus =
      document.getElementById(
        "requestStatus"
      );


    const requestsList =
      document.getElementById(
        "requestsList"
      );


    /*
      =========================================
      HILFSFUNKTIONEN
      =========================================
    */


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function formatDate(value) {

      if (!value) {
        return "–";
      }


      const date =
        new Date(
          value + "T00:00:00"
        );


      return date.toLocaleDateString(
        "de-DE",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    function formatDateTime(value) {

      if (!value) {
        return "–";
      }


      const date =
        new Date(value);


      return date.toLocaleString(
        "de-DE",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    function formatGuests(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "–";
      }


      return `${value} Gäste`;

    }


    function formatTimeRange(
      start,
      end
    ) {

      if (!start && !end) {
        return "–";
      }


      if (start && end) {
        return `${start} – ${end} Uhr`;
      }


      if (start) {
        return `ab ${start} Uhr`;
      }


      return `bis ${end} Uhr`;

    }


    /*
      =========================================
      ANFRAGE DARSTELLEN
      =========================================
    */


    function createRequestCard(
      request
    ) {

      const name =
        escapeHtml(
          request.name || "Unbekannt"
        );


      const eventType =
        escapeHtml(
          request.event_type ||
          "Veranstaltung"
        );


      const location =
        escapeHtml(
          request.location || "–"
        );


      const billingName =
        escapeHtml(
          request.billing_name || "–"
        );


      const billingStreet =
        escapeHtml(
          request.billing_street || "–"
        );


      const billingZip =
        escapeHtml(
          request.billing_zip || "–"
        );


      const billingCity =
        escapeHtml(
          request.billing_city || "–"
        );


      const phone =
        escapeHtml(
          request.phone || "–"
        );


      const email =
        escapeHtml(
          request.email || "–"
        );


      const message =
        request.message
          ? escapeHtml(request.message)
          : "";


      const safeEmail =
        request.email
          ? encodeURIComponent(
              request.email
            )
          : "";


      const safePhone =
        request.phone
          ? encodeURIComponent(
              request.phone
            )
          : "";


      const card =
        document.createElement("article");


      card.className =
        "request-card";


      card.innerHTML = `

        <div class="request-top">

          <div>

            <h2 class="request-title">
              ${name}
            </h2>

            <div class="request-type">
              ${eventType}
            </div>

          </div>


          <div class="request-date">

            ${formatDate(
              request.event_date
            )}

          </div>

        </div>


        <div class="request-body">

          <div class="request-grid">


            <!-- EVENT -->

            <div class="request-section">

              <h3>
                Veranstaltung
              </h3>


              <div class="request-info">

                <div class="request-row">

                  <span class="request-label">
                    Datum
                  </span>

                  <span class="request-value">
                    ${formatDate(
                      request.event_date
                    )}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Gäste
                  </span>

                  <span class="request-value">
                    ${formatGuests(
                      request.guests
                    )}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Ort
                  </span>

                  <span class="request-value">
                    ${location}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Zeit
                  </span>

                  <span class="request-value">
                    ${formatTimeRange(
                      request.start_time,
                      request.end_time
                    )}
                  </span>

                </div>

              </div>

            </div>


            <!-- CONTACT -->

            <div class="request-section">

              <h3>
                Kontakt
              </h3>


              <div class="request-info">


                <div class="request-row">

                  <span class="request-label">
                    E-Mail
                  </span>

                  <span class="request-value">

                    ${
                      request.email
                        ? `
                          <a
                            href="mailto:${safeEmail}"
                          >
                            ${email}
                          </a>
                        `
                        : "–"
                    }

                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Telefon
                  </span>

                  <span class="request-value">

                    ${
                      request.phone
                        ? `
                          <a
                            href="tel:${safePhone}"
                          >
                            ${phone}
                          </a>
                        `
                        : "–"
                    }

                  </span>

                </div>

              </div>

            </div>


            <!-- BILLING -->

            <div class="request-section">

              <h3>
                Rechnungsadresse
              </h3>


              <div class="request-info">

                <div class="request-row">

                  <span class="request-label">
                    Name / Firma
                  </span>

                  <span class="request-value">
                    ${billingName}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Straße
                  </span>

                  <span class="request-value">
                    ${billingStreet}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    PLZ / Ort
                  </span>

                  <span class="request-value">
                    ${billingZip}
                    ${billingCity}
                  </span>

                </div>

              </div>

            </div>


            <!-- MESSAGE -->

            <div class="request-section">

              <h3>
                Nachricht
              </h3>


              <div
                class="
                  request-message
                  ${message ? "" : "empty"}
                "
              >

                ${
                  message ||
                  "Keine zusätzliche Nachricht angegeben."
                }

              </div>

            </div>

          </div>

        </div>


        <div class="request-meta">

          Anfrage eingegangen:
          ${formatDateTime(
            request.created_at
          )}

        </div>

      `;


      return card;

    }


    /*
      =========================================
      LOGIN PRÜFEN
      =========================================
    */


    async function checkLogin() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (
        error ||
        !data.session
      ) {

        window.location.replace(
          "./"
        );

        return false;

      }


      document.getElementById(
        "userEmail"
      ).textContent =
        data.session.user.email;


      return true;

    }


    /*
      =========================================
      ANFRAGEN LADEN
      =========================================
    */


    async function loadRequests() {

      requestStatus.style.display =
        "block";


      requestStatus.className =
        "request-status";


      requestStatus.textContent =
        "Anfragen werden geladen …";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("anfragen")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Fehler beim Laden der Anfragen:",
          error
        );


        requestStatus.className =
          "request-status error";


        requestStatus.textContent =
          "Die Anfragen konnten leider nicht geladen werden.";


        return;

      }


      requestsList.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        requestStatus.textContent =
          "Noch keine Anfragen vorhanden.";

        return;

      }


      requestStatus.style.display =
        "none";


      data.forEach(
        function(request) {

          requestsList.appendChild(
            createRequestCard(
              request
            )
          );

        }
      );

    }


    /*
      =========================================
      LOGOUT
      =========================================
    */


    document.getElementById(
      "logoutButton"
    ).addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.replace(
          "./"
        );

      }
    );


    /*
      =========================================
      START
      =========================================
    */


    async function init() {

      const loggedIn =
        await checkLogin();


      if (!loggedIn) {
        return;
      }


      await loadRequests();

    }


    init();

  </script>


</body>

</html>
