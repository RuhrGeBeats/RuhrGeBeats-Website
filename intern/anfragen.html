<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anfragen – RuhrGeBeats</title>

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <link
    rel="icon"
    href="../logo.png"
  >

  <link
    rel="stylesheet"
    href="./intern.css"
  >

  <!-- PDF-Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <style>

    /* =========================================
       ANFRAGEN
       ========================================= */

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 30px;
    }


    .page-header h1 {
      margin: 8px 0 5px;
      font-size: clamp(32px, 5vw, 46px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }


    .page-header p {
      margin: 0;
      color: var(--muted);
    }


    .back-dashboard {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 9px 15px;

      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;

      font-size: 13px;
      font-weight: 700;

      transition: .2s ease;
    }


    .back-dashboard:hover {
      border-color: #b8dcfa;
      color: var(--blue-dark);
    }


    /* =========================================
       STATUS
       ========================================= */

    .request-status {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 20px;

      color: var(--muted);
      text-align: center;

      margin-bottom: 20px;
    }


    .request-status.error {
      color: var(--danger);
      background: #fff6f6;
      border-color: #f0caca;
    }


    /* =========================================
       REQUEST CARD
       ========================================= */

    .requests-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }


    .request-card {
      background: var(--white);

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow:
        0 15px 40px rgba(7,17,31,.06);

      overflow: hidden;
    }


    .request-top {
      padding: 24px 26px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      border-bottom: 1px solid var(--border);
    }


    .request-title {
      margin: 0;

      font-size: 22px;
      letter-spacing: -.025em;
    }


    .request-type {
      margin-top: 4px;

      color: var(--blue-dark);

      font-size: 13px;
      font-weight: 800;
    }


    .request-date {
      flex-shrink: 0;

      padding: 6px 11px;

      background: #eaf5ff;
      color: var(--blue-dark);

      border-radius: 999px;

      font-size: 12px;
      font-weight: 800;
    }


    .request-body {
      padding: 25px 26px;
    }


    /* =========================================
       DATA GRID
       ========================================= */

    .request-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 24px;
    }


    .request-section {
      min-width: 0;
    }


    .request-section.full {
      grid-column: 1 / -1;
    }


    .request-section h3 {
      margin: 0 0 12px;

      font-size: 13px;

      text-transform: uppercase;
      letter-spacing: .08em;

      color: var(--muted);
    }


    .request-info {
      display: flex;
      flex-direction: column;
      gap: 7px;

      font-size: 14px;
    }


    .request-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }


    .request-label {
      flex: 0 0 125px;

      color: var(--muted);
      font-size: 13px;
    }


    .request-value {
      min-width: 0;

      font-weight: 650;

      overflow-wrap: anywhere;
    }


    .request-value a {
      color: var(--blue-dark);
    }


    .request-value a:hover {
      text-decoration: underline;
    }


    /* =========================================
       MESSAGE
       ========================================= */

    .request-message {
      padding: 16px;

      background: var(--light);

      border-radius: 13px;

      color: #3f4b57;

      font-size: 14px;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }


    .request-message.empty {
      color: var(--muted);
      font-style: italic;
    }


    /* =========================================
       PDF BUTTON
       ========================================= */

    .request-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      padding: 14px 26px;

      border-top: 1px solid var(--border);

      background: #fbfcfd;
    }


    .pdf-button {
      border: 0;
      border-radius: 10px;

      padding: 10px 15px;

      background: #07589f;
      color: #ffffff;

      font: inherit;
      font-size: 13px;
      font-weight: 800;

      cursor: pointer;

      transition:
        background .2s ease,
        transform .2s ease;
    }


    .pdf-button:hover {
      background: #06477f;
      transform: translateY(-1px);
    }


    .pdf-button:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }


    /* =========================================
       REQUEST META
       ========================================= */

    .request-meta {
      padding: 13px 26px;

      background: #fafbfc;

      border-top: 1px solid var(--border);

      color: var(--muted);

      font-size: 11px;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 700px) {

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }


      .request-top {
        padding: 21px;
        flex-direction: column;
      }


      .request-body {
        padding: 21px;
      }


      .request-grid {
        grid-template-columns: 1fr;
        gap: 25px;
      }


      .request-section.full {
        grid-column: auto;
      }


      .request-label {
        flex-basis: 105px;
      }


      .request-actions {
        padding: 14px 21px;
      }


      .pdf-button {
        width: 100%;
      }


      .request-meta {
        padding: 13px 21px;
      }

    }

  </style>

</head>

  <!-- =========================================

  <footer class="intern-footer">

  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    const SUPABASE_URL =
      "https://spqsuedpmrxcbefpocho.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_m-jonK9Ca3K10OKxaorcgQ_9P5OhVGr";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const requestStatus =
      document.getElementById(
        "requestStatus"
      );


    const requestsList =
      document.getElementById(
        "requestsList"
      );


    /* =========================================
       HILFSFUNKTIONEN
       ========================================= */


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function formatDate(value) {

      if (!value) {
        return "–";
      }


      const date =
        new Date(
          value + "T00:00:00"
        );


      return date.toLocaleDateString(
        "de-DE",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    function formatDateTime(value) {

      if (!value) {
        return "–";
      }


      const date =
        new Date(value);


      return date.toLocaleString(
        "de-DE",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    function formatGuests(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "–";
      }


      return `${value} Gäste`;

    }


    function formatTimeRange(
      start,
      end
    ) {

      if (!start && !end) {
        return "–";
      }


      if (start && end) {
        return `${start} – ${end} Uhr`;
      }


      if (start) {
        return `ab ${start} Uhr`;
      }


      return `bis ${end} Uhr`;

    }


    /* =========================================
       ANFRAGE DARSTELLEN
       ========================================= */


    function createRequestCard(
      request
    ) {

      const name =
        escapeHtml(
          request.name || "Unbekannt"
        );


      const eventType =
        escapeHtml(
          request.event_type ||
          "Veranstaltung"
        );


      const location =
        escapeHtml(
          request.location || "–"
        );


      const billingName =
        escapeHtml(
          request.billing_name || "–"
        );


      const billingStreet =
        escapeHtml(
          request.billing_street || "–"
        );


      const billingZip =
        escapeHtml(
          request.billing_zip || "–"
        );


      const billingCity =
        escapeHtml(
          request.billing_city || "–"
        );


      const phone =
        escapeHtml(
          request.phone || "–"
        );


      const email =
        escapeHtml(
          request.email || "–"
        );


      const message =
        request.message
          ? escapeHtml(request.message)
          : "";


      const safeEmail =
        request.email
          ? encodeURIComponent(
              request.email
            )
          : "";


      const safePhone =
        request.phone
          ? encodeURIComponent(
              request.phone
            )
          : "";


      const card =
        document.createElement("article");


      card.className =
        "request-card";


      card.innerHTML = `

        <div class="request-top">

          <div>

            <h2 class="request-title">
              ${name}
            </h2>

            <div class="request-type">
              ${eventType}
            </div>

          </div>


          <div class="request-date">

            ${formatDate(
              request.event_date
            )}

          </div>

        </div>


        <div class="request-body">

          <div class="request-grid">


            <!-- EVENT -->

            <div class="request-section">

              <h3>
                Veranstaltung
              </h3>


              <div class="request-info">

                <div class="request-row">

                  <span class="request-label">
                    Datum
                  </span>

                  <span class="request-value">
                    ${formatDate(
                      request.event_date
                    )}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Gäste
                  </span>

                  <span class="request-value">
                    ${formatGuests(
                      request.guests
                    )}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Ort
                  </span>

                  <span class="request-value">
                    ${location}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Zeit
                  </span>

                  <span class="request-value">
                    ${formatTimeRange(
                      request.start_time,
                      request.end_time
                    )}
                  </span>

                </div>

              </div>

            </div>


            <!-- CONTACT -->

            <div class="request-section">

              <h3>
                Kontakt
              </h3>


              <div class="request-info">


                <div class="request-row">

                  <span class="request-label">
                    E-Mail
                  </span>

                  <span class="request-value">

                    ${
                      request.email
                        ? `
                          <a
                            href="mailto:${safeEmail}"
                          >
                            ${email}
                          </a>
                        `
                        : "–"
                    }

                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Telefon
                  </span>

                  <span class="request-value">

                    ${
                      request.phone
                        ? `
                          <a
                            href="tel:${safePhone}"
                          >
                            ${phone}
                          </a>
                        `
                        : "–"
                    }

                  </span>

                </div>

              </div>

            </div>


            <!-- BILLING -->

            <div class="request-section">

              <h3>
                Rechnungsadresse
              </h3>


              <div class="request-info">

                <div class="request-row">

                  <span class="request-label">
                    Name / Firma
                  </span>

                  <span class="request-value">
                    ${billingName}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    Straße
                  </span>

                  <span class="request-value">
                    ${billingStreet}
                  </span>

                </div>


                <div class="request-row">

                  <span class="request-label">
                    PLZ / Ort
                  </span>

                  <span class="request-value">
                    ${billingZip}
                    ${billingCity}
                  </span>

                </div>

              </div>

            </div>


            <!-- MESSAGE -->

            <div class="request-section">

              <h3>
                Nachricht
              </h3>


              <div
                class="
                  request-message
                  ${message ? "" : "empty"}
                "
              >

                ${
                  message ||
                  "Keine zusätzliche Nachricht angegeben."
                }

              </div>

            </div>


          </div>

        </div>


        <div class="request-meta">

          Anfrage eingegangen:
          ${formatDateTime(
            request.created_at
          )}

        </div>


        <!-- PDF BUTTON -->

        <div class="request-actions">

          <button
            type="button"
            class="pdf-button"
            onclick="createRequestPdf(this)"
          >
            📄 PDF erstellen
          </button>

        </div>

      `;


      return card;

    }


    /* =========================================
       PDF HILFSFUNKTIONEN
       ========================================= */


    function pdfText(value) {

      return String(
        value ?? ""
      )
        .replace(/\u00a0/g, " ")
        .trim();

    }


    function pdfDate(value) {

      if (!value) {
        return "–";
      }


      const date =
        new Date(
          value + "T00:00:00"
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return pdfText(value);
      }


      return date.toLocaleDateString(
        "de-DE"
      );

    }


    function pdfDateTime(value) {

      if (!value) {
        return "–";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return pdfText(value);
      }


      return date.toLocaleString(
        "de-DE",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

    }


    function pdfLines(
      doc,
      text,
      width
    ) {

      return doc.splitTextToSize(
        pdfText(text) || "–",
        width
      );

    }


    function pdfSection(
      doc,
      title,
      y
    ) {

      doc.setFont(
        "helvetica",
        "bold"
      );

      doc.setFontSize(10);

      doc.setTextColor(
        31,
        70,
        112
      );

      doc.text(
        title.toUpperCase(),
        20,
        y
      );

      doc.setDrawColor(
        170,
        180,
        190
      );

      doc.setLineWidth(.25);

      doc.line(
        20,
        y + 2.5,
        190,
        y + 2.5
      );

      return y + 9;

    }


    function logoData() {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const image =
            new Image();


          image.onload =
            function() {

              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                image.naturalWidth;

              canvas.height =
                image.naturalHeight;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0
              );


              resolve(
                canvas.toDataURL(
                  "image/png"
                )
              );

            };


          image.onerror =
            reject;


          image.src =
            "../logo.png";

        }
      );

    }


    /* =========================================
       PDF ERSTELLEN
       ========================================= */


    async function createRequestPdf(
      button
    ) {

      const card =
        button.closest(
          ".request-card"
        );


      const cards =
        [
          ...document.querySelectorAll(
            ".request-card"
          )
        ];


      const index =
        cards.indexOf(card);


      try {

        button.disabled = true;

        button.textContent =
          "PDF wird erstellt …";


        /*
          Anfrage erneut aus Supabase laden.
          Dadurch verwenden wir garantiert
          die aktuellen Daten.
        */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("anfragen")
            .select("*")
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {
          throw error;
        }


        const request =
          data?.[index];


        if (!request) {

          throw new Error(
            "Die Anfrage konnte nicht geladen werden."
          );

        }


        if (
          !window.jspdf ||
          !window.jspdf.jsPDF
        ) {

          throw new Error(
            "Die PDF-Bibliothek konnte nicht geladen werden."
          );

        }


        const {
          jsPDF
        } =
          window.jspdf;


        const doc =
          new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
          });


        const blue = [
          31,
          91,
          145
        ];


        const dark = [
          25,
          25,
          25
        ];


        const muted = [
          90,
          90,
          90
        ];


        /* =====================================
           LOGO LADEN
           ===================================== */

        let logo = null;


        try {

          logo =
            await logoData();

        } catch (error) {

          console.warn(
            "RuhrGeBeats Logo konnte nicht geladen werden.",
            error
          );

        }


        /* =====================================
           HINTERGRUND
           ===================================== */

        doc.setFillColor(
          255,
          255,
          255
        );


        doc.rect(
          0,
          0,
          210,
          297,
          "F"
        );


        /*
          Großes dezentes Logo als
          Wasserzeichen – wie bei
          euren Angeboten/Rechnungen.
        */

        if (logo) {

          try {

            if (
              typeof doc.GState === "function" &&
              typeof doc.setGState === "function"
            ) {

              doc.setGState(
                new doc.GState({
                  opacity: 0.08
                })
              );

            }


            doc.addImage(
              logo,
              "PNG",
              28,
              60,
              154,
              110
            );


            if (
              typeof doc.GState === "function" &&
              typeof doc.setGState === "function"
            ) {

              doc.setGState(
                new doc.GState({
                  opacity: 1
                })
              );

            }

          } catch (error) {

            console.warn(
              "Logo-Wasserzeichen konnte nicht gesetzt werden.",
              error
            );

          }

        }


        /* =====================================
           KOPF
           ===================================== */

        doc.setTextColor(
          ...dark
        );


        doc.setFont(
          "helvetica",
          "normal"
        );


        doc.setFontSize(25);


        doc.text(
          "ANFRAGE",
          20,
          18
        );


        doc.setFontSize(8.5);


        doc.setTextColor(
          ...muted
        );


        doc.text(
          "DATUM",
          20,
          30
        );


        doc.text(
          "VORGANGSNUMMER",
          75,
          30
        );


        doc.setFontSize(10);


        doc.setTextColor(
          ...dark
        );


        doc.text(
          pdfDate(
            request.created_at
              ? request.created_at.slice(
                  0,
                  10
                )
              : new Date()
                  .toISOString()
                  .slice(
                    0,
                    10
                  )
          ),
          20,
          36
        );


        const year =
          request.created_at
            ? new Date(
                request.created_at
              ).getFullYear()
            : new Date().getFullYear();


        const requestId =
          String(
            request.id ||
            "ANFR"
          )
            .replaceAll(
              "-",
              ""
            )
            .slice(
              0,
              6
            )
            .toUpperCase();


        doc.text(
          `${year}-${requestId}`,
          75,
          36
        );


        /* =====================================
           RUHRGEBEATS KOPFBEREICH
           ===================================== */

        doc.setFont(
          "helvetica",
          "bold"
        );


        doc.setFontSize(11);


        doc.setTextColor(
          ...dark
        );


        doc.text(
          "RuhrGeBeats",
          20,
          48
        );


        doc.setFont(
          "helvetica",
          "normal"
        );


        doc.setFontSize(8.5);


        doc.setTextColor(
          ...muted
        );


        doc.text(
          "Tom Karpa & Lenny Günther",
          20,
          53
        );


        doc.text(
          "ruhrgebeats@gmail.com",
          20,
          58
        );


        /*
          Kleines Logo oben rechts
        */

        if (logo) {

          try {

            doc.addImage(
              logo,
              "PNG",
              164,
              23,
              26,
              26
            );

          } catch (error) {}

        }


        /* =====================================
           ANFRAGE VON
           ===================================== */

        let y = 72;


        y =
          pdfSection(
            doc,
            "Anfrage von",
            y
          );


        doc.setTextColor(
          ...dark
        );


        doc.setFont(
          "helvetica",
          "bold"
        );


        doc.setFontSize(10);


        let lines =
          pdfLines(
            doc,
            request.billing_name ||
            request.name,
            75
          );


        doc.text(
          lines,
          20,
          y
        );


        y +=
          lines.length * 5;


        doc.setFont(
          "helvetica",
          "normal"
        );


        doc.setFontSize(9);


        doc.text(
          pdfText(
            request.billing_street
          ) || "–",
          20,
          y
        );


        y += 5;


        doc.text(
          (
            pdfText(
              request.billing_zip
            ) +
            " " +
            pdfText(
              request.billing_city
            )
          ).trim() || "–",
          20,
          y
        );


        /* =====================================
           VERANSTALTUNG
           ===================================== */

        let rightY = 81;


        doc.setFont(
          "helvetica",
          "bold"
        );


        doc.setFontSize(10);


        doc.setTextColor(
          ...blue
        );


        doc.text(
          "VERANSTALTUNG",
          110,
          rightY
        );


        rightY += 8;


        doc.setTextColor(
          ...dark
        );


        doc.text(
          pdfText(
            request.event_type
          ) ||
          "Veranstaltung",
          110,
          rightY
        );


        rightY += 7;


        doc.setFont(
          "helvetica",
          "normal"
        );


        doc.setFontSize(9);


        const eventData = [

          [
            "Datum",
            pdfDate(
              request.event_date
            )
          ],

          [
            "Gäste",
            formatGuests(
              request.guests
            )
          ],

          [
            "Ort",
            request.location ||
            "–"
          ],

          [
            "Zeit",
            formatTimeRange(
              request.start_time,
              request.end_time
            )
          ]

        ];


        eventData.forEach(
          function([
            label,
            value
          ]) {

            doc.setTextColor(
              ...muted
            );


            doc.text(
              `${label}:`,
              110,
              rightY
            );


            doc.setTextColor(
              ...dark
            );


            const valueLines =
              pdfLines(
                doc,
                value,
                58
              );


            doc.text(
              valueLines,
              130,
              rightY
            );


            rightY += Math.max(
              5,
              valueLines.length * 4.5
            );

          }
        );


        y =
          Math.max(
            y,
            rightY
          ) + 8;


        /* =====================================
           KONTAKT
           ===================================== */

        y =
          pdfSection(
            doc,
            "Kontakt",
            y
          );


        doc.setFont(
          "helvetica",
          "normal"
        );


        doc.setFontSize(9);


        doc.setTextColor(
          ...dark
        );


        doc.text(
          "Name:",
          20,
          y
        );


        doc.text(
          pdfText(
            request.name
          ) || "–",
          40,
          y
        );


        doc.text(
          "E-Mail:",
          110,
          y
        );


        doc.text(
          pdfText(
            request.email
          ) || "–",
          132,
          y
        );


        y += 6;


        doc.text(
          "Telefon:",
          20,
          y
        );


        doc.text(
          pdfText(
            request.phone
          ) || "–",
          40,
          y
        );


        y += 10;


        /* =====================================
           WÜNSCHE
           ===================================== */

        y =
          pdfSection(
            doc,
            "Wünsche & Angaben",
            y
          );


        doc.setFont(
          "helvetica",
          "bold"
        );


        doc.setFontSize(9);


        doc.setTextColor(
          ...dark
        );


        if (
          request.technical_wishes
        ) {

          doc.text(
            "Technische Wünsche:",
            20,
            y
          );


          y += 5;


          doc.setFont(
            "helvetica",
            "normal"
          );


          let wishLines =
            pdfLines(
              doc,
              request.technical_wishes,
              170
            );


          doc.text(
            wishLines,
            20,
            y
          );


          y +=
            wishLines.length *
            4.5 +
            4;


          doc.setFont(
            "helvetica",
            "bold"
          );

        }


        if (
          request.message
        ) {

          doc.text(
            "Nachricht:",
            20,
            y
          );


          y += 5;


          doc.setFont(
            "helvetica",
            "normal"
          );


          let messageLines =
            pdfLines(
              doc,
              request.message,
              170
            );


          doc.text(
            messageLines,
            20,
            y
          );


          y +=
            messageLines.length *
            4.5 +
            4;

        }


        if (
          !request.technical_wishes &&
          !request.message
        ) {

          doc.setFont(
            "helvetica",
            "normal"
          );


          doc.setTextColor(
            ...muted
          );


          doc.text(
            "Keine zusätzlichen Angaben.",
            20,
            y
          );


          y += 8;

        }


        /* =====================================
           RECHNUNGSADRESSE
           ===================================== */

        y += 3;


        y =
          pdfSection(
            doc,
            "Rechnungsadresse",
            y
          );


        doc.setFont(
          "helvetica",
          "normal"
        );


        doc.setFontSize(9);


        doc.setTextColor(
          ...dark
        );


        const address = [

          request.billing_name ||
          request.name,

          request.billing_street,

          (
            pdfText(
              request.billing_zip
            ) +
            " " +
            pdfText(
              request.billing_city
            )
          ).trim()

        ]
          .filter(Boolean)
          .join("\n");


        const addressLines =
          address
            ? address.split("\n")
            : [
                "Keine Rechnungsadresse angegeben."
              ];


        doc.text(
          addressLines,
          20,
          y
        );


        y +=
          Math.max(
            12,
            addressLines.length * 4.5
          ) + 4;


        /* =====================================
           EINGANG
           ===================================== */

        doc.setFillColor(
          241,
          247,
          252
        );


        doc.roundedRect(
          20,
          y,
          170,
          18,
          3,
          3,
          "F"
        );


        doc.setFont(
          "helvetica",
          "bold"
        );


        doc.setFontSize(9);


        doc.setTextColor(
          ...blue
        );


        doc.text(
          "ANFRAGE EINGEGANGEN",
          27,
          y + 7
        );


        doc.setFont(
          "helvetica",
          "normal"
        );


        doc.setTextColor(
          ...dark
        );


        doc.text(
          pdfDateTime(
            request.created_at
          ),
          27,
          y + 13
        );


        /* =====================================
           FOOTER
           ===================================== */

        doc.setDrawColor(
          190,
          190,
          190
        );


        doc.setLineWidth(
          0.25
        );


        doc.line(
          20,
          278,
          190,
          278
        );


        doc.setFont(
          "helvetica",
          "normal"
        );


        doc.setFontSize(
          7.5
        );


        doc.setTextColor(
          ...muted
        );


        doc.text(
          "RuhrGeBeats GbR · Tom Karpa & Lenny Günther",
          20,
          285
        );


        doc.text(
          "ruhrgebeats@gmail.com",
          20,
          290
        );


        /* =====================================
           DATEINAME
           ===================================== */

        const safeName =
          (
            request.billing_name ||
            request.name ||
            "Anfrage"
          )
            .toString()
            .replace(
              /[^a-zA-Z0-9äöüÄÖÜß_-]+/g,
              "_"
            )
            .replace(
              /^_+|_+$/g,
              ""
            );


        const eventDate =
          request.event_date ||
          new Date()
            .toISOString()
            .slice(
              0,
              10
            );


        const filename =
          `RuhrGeBeats_Anfrage_${safeName || "Anfrage"}_${eventDate}.pdf`;


        doc.save(
          filename
        );

      } catch (error) {

        console.error(
          "Fehler beim Erstellen der Anfrage-PDF:",
          error
        );


        alert(
          "Die PDF konnte leider nicht erstellt werden.\n\n" +
          (
            error?.message ||
            "Unbekannter Fehler"
          )
        );

      } finally {

        button.disabled =
          false;


        button.textContent =
          "📄 PDF erstellen";

      }

    }


    /* =========================================
       LOGIN PRÜFEN
       ========================================= */


    async function checkLogin() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (
        error ||
        !data.session
      ) {

        window.location.replace(
          "./"
        );

        return false;

      }


      document.getElementById(
        "userEmail"
      ).textContent =
        data.session.user.email;


      return true;

    }


    /* =========================================
       ANFRAGEN LADEN
       ========================================= */


    async function loadRequests() {

      requestStatus.style.display =
        "block";


      requestStatus.className =
        "request-status";


      requestStatus.textContent =
        "Anfragen werden geladen …";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("anfragen")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Fehler beim Laden der Anfragen:",
          error
        );


        requestStatus.className =
          "request-status error";


        requestStatus.textContent =
          "Die Anfragen konnten leider nicht geladen werden.";


        return;

      }


      requestsList.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        requestStatus.textContent =
          "Noch keine Anfragen vorhanden.";

        return;

      }


      requestStatus.style.display =
        "none";


      data.forEach(
        function(request) {

          requestsList.appendChild(
            createRequestCard(
              request
            )
          );

        }
      );

    }


    /* =========================================
       LOGOUT
       ========================================= */


    document.getElementById(
      "logoutButton"
    ).addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.replace(
          "./"
        );

      }
    );


    /* =========================================
       START
       ========================================= */


    async function init() {

      const loggedIn =
        await checkLogin();


      if (!loggedIn) {
        return;
      }


      await loadRequests();

    }


    init();

  </script>
